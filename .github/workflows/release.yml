# Build standalone `ragedocker` binaries (Node SEA) for every OS on a tag, and
# attach them to the GitHub Release so users can install with no Node/npm.
#
# Trigger: push a tag like `v1.1.0`.
#
# Crafted by SoyRage Agency — https://soyrage.es/
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ragedocker-linux-x64
          - os: macos-13          # x64
            asset: ragedocker-macos-x64
          - os: macos-latest      # arm64
            asset: ragedocker-macos-arm64
          - os: windows-latest
            asset: ragedocker-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build standalone binary
        run: npm run build:sea
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/ragedocker.exe "out/${{ matrix.asset }}"
          else
            cp build/ragedocker "out/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          generate_release_notes: true

  # Publish to npm without any long-lived token: the job proves its identity to
  # the registry over OIDC (trusted publishing), which is also what mints the
  # provenance attestation shown on the npm page.
  npm:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # A tag can be re-pushed (or the job re-run) after the version is already
      # on the registry; publishing again would just fail the whole release.
      - id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already published — skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public

  # Multi-arch image on GitHub's own registry, tagged with the release version
  # and `latest`. Home-labbers tend to reach for this before npm.
  docker:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/soyrageagency/docker-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Announce the server on the official MCP registry. The registry only stores
  # metadata, so it runs after npm: it validates that the package named in
  # server.json really exists and that its `mcpName` matches.
  #
  # The registry is still in preview, so a failure here must not fail the
  # release — the npm package and the GitHub release are what users install.
  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # Keep server.json in step with the tag so the two can never drift.
      - name: Sync server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      # OIDC: the io.github.soyrageagency/* namespace is proven by the workflow
      # itself, so there is no token to store or rotate.
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
